name: Update official events

on:
  schedule:
    # 03:17 and 15:17 Taipei time (after typical maintenance windows)
    - cron: '17 19 * * *'
    - cron: '17 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: official-events
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch official news
        env:
          EVENTS_FEED_URL: ${{ vars.EVENTS_FEED_URL }}
          EVENTS_LIST_URL: ${{ vars.EVENTS_LIST_URL }}
        run: npx tsx scripts/fetch-official-events.ts
      - name: Commit if changed
        run: |
          if git diff --quiet -- public/data/official-events.json; then
            echo "No changes"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/official-events.json
          git commit -m "chore(data): update official events"
          git push
