name: Deploy to Cloudflare Pages

# Builds the site and uploads it to the existing Direct Upload Pages project
# "eorzea-utility-hub" (ff14.calcnest.tw).
#
# Required repository secrets:
#   CLOUDFLARE_API_TOKEN   token with "Cloudflare Pages: Edit"
#   CLOUDFLARE_ACCOUNT_ID  927db10b9948dff61b3cc5330bb81421
# Optional repository variable:
#   VITE_N8N_EVENTS_URL    legacy n8n webhook used as a second events source

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # When called after the events job commits, deploy the newest main, not the triggering SHA.
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Build
        env:
          VITE_N8N_EVENTS_URL: ${{ vars.VITE_N8N_EVENTS_URL }}
        run: npm run build
      - name: Upload to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >
          npx --yes wrangler@4 pages deploy dist
          --project-name eorzea-utility-hub
          --branch main
          --commit-hash "$(git rev-parse HEAD)"
          --commit-message "$(git log -1 --pretty=%s | head -c 300)"
